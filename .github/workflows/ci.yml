name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      - name: Install end-to-end dependencies
        working-directory: tests/e2e
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Run responsive and accessibility smoke tests
        working-directory: tests/e2e
        run: npm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: family_dashboard_test
          POSTGRES_USER: family_dashboard
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_dashboard -d family_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FamilyDashboard.sln
      - name: Build
        run: dotnet build FamilyDashboard.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FamilyDashboard.sln --configuration Release --no-build
        env:
          TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=family_dashboard_test;Username=family_dashboard

  delivery-artifacts:
    name: Containers and manifests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build backend production image
        run: docker build --file src/backend/FamilyDashboard.Api/Dockerfile --target production --tag family-dashboard-api:ci .
      - name: Build frontend production image
        run: docker build --build-arg VITE_API_BASE_URL=https://api.example.invalid --file src/frontend/Dockerfile --target production --tag family-dashboard-web:ci src/frontend
      - name: Render K3s manifests
        run: |
          kubectl kustomize deploy/k8s/k3s > /tmp/family-dashboard-k3s.yaml
          kubectl kustomize deploy/k8s/local > /tmp/family-dashboard-local-k3s.yaml
