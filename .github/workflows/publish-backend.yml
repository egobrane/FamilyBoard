name: Publish backend image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'FamilyDashboard.sln'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'global.json'
      - '.dockerignore'
      - '.github/workflows/publish-backend.yml'
      - '.github/workflows/deploy-azure-staging.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/familyboard-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: family_dashboard_test
          POSTGRES_USER: family_dashboard
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_dashboard -d family_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build and test backend
        run: |
          dotnet restore FamilyDashboard.sln
          dotnet build FamilyDashboard.sln --configuration Release --no-restore
          dotnet test FamilyDashboard.sln --configuration Release --no-build
        env:
          TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=family_dashboard_test;Username=family_dashboard
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish multi-architecture image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/FamilyDashboard.Api/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarize the immutable publication
        run: |
          {
            echo "## Backend image publication"
            echo ""
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    uses: ./.github/workflows/deploy-azure-staging.yml
    with:
      backend_image: ${{ format('ghcr.io/{0}/familyboard-backend@{1}', github.repository_owner, needs.publish.outputs.image_digest) }}
      source_sha: ${{ github.sha }}
