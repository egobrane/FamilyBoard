apiVersion: v1
kind: ConfigMap
metadata:
  name: family-dashboard-api
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  Cors__AllowedOrigins__0: https://dashboard.example.com
  ParentAccess__Enabled: "true"
  GoogleCalendar__Enabled: "false"
  GoogleCalendar__EventCreationEnabled: "false"
  GoogleCalendar__EventManagementEnabled: "false"
  GoogleTasks__Enabled: "false"
  GoogleTasks__MutationsEnabled: "false"
  GoogleTasks__ClientId: ""
  GoogleTasks__CallbackUrl: ""
  HouseholdMedia__Enabled: "true"
  HouseholdMedia__Provider: FileSystem
  HouseholdMedia__LocalPath: /app/data/household-photos
  Weather__Enabled: "true"
  Weather__RadarEnabled: "true"
  Weather__RadarWmsUrl: https://mapservices.weather.noaa.gov/eventdriven/services/radar/radar_base_reflectivity/MapServer/WMSServer
  Weather__RadarWmsLayer: "0"
  Weather__Provider: Nws
