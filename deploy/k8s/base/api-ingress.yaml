apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: family-dashboard-api
spec:
  rules:
    - host: api.family-dashboard.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: family-dashboard-api
                port:
                  name: http
