apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: family-dashboard
resources:
  - namespace.yaml
  - api-configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - migration-job.yaml
  - chore-generator-cronjob.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
    includeTemplates: true
