apiVersion: batch/v1
kind: Job
metadata:
  name: family-dashboard-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: family-dashboard-migrate
        app.kubernetes.io/part-of: family-dashboard
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/egobrane/familyboard-backend:replace-with-immutable-tag
          args: ["--migrate"]
          env:
            - name: ConnectionStrings__FamilyDashboard
              valueFrom:
                secretKeyRef:
                  name: family-dashboard-secrets
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
